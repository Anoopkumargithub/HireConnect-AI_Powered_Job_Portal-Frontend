<div class="hc-card">
    <div class="d-flex justify-content-between align-items-center">
        <div class="hc-section-title">Applications per Job</div>
        <a
            class="btn btn-outline-primary btn-sm"
            ng-href="#/recruiter/ranked-candidates/{{$ctrl.selectedJobId}}"
            >View Ranked Candidates</a
        >
    </div>
    <div class="mt-3">
        <label class="form-label">Select Job</label>
        <select
            class="form-select hc-input"
            ng-model="$ctrl.selectedJobId"
            ng-options="job.jobId as job.title for job in $ctrl.jobs"
            ng-change="$ctrl.loadApplications()"
        ></select>
    </div>
    <div class="text-danger mt-2" ng-if="$ctrl.errorMessage">
        {{$ctrl.errorMessage}}
    </div>
</div>

<div class="hc-card mt-4" ng-repeat="application in $ctrl.applications">
    <div class="d-flex justify-content-between">
        <div>
            <div class="fw-semibold">{{application.candidateName}}</div>
            <div class="text-muted" style="font-size: 0.9em;">
                {{application.candidateEmail}}
            </div>
            <div class="text-muted mt-1" style="font-size: 0.8em;">
                App ID: {{application.applicationId}}
            </div>
        </div>
        <span class="hc-pill">{{$ctrl.statusLabel(application.status)}}</span>
    </div>
    <div class="mt-3">
        <div class="d-flex justify-content-between">
            <span>AI Match Score</span>
            <span>{{application.aiMatchScore || 0}}%</span>
        </div>
        <div class="hc-progress mt-1">
            <span
                ng-style="{'width': (application.aiMatchScore || 0) + '%'}"
            ></span>
        </div>
    </div>
    <div class="mt-3 d-flex gap-2">
        <button
            class="btn btn-outline-success btn-sm"
            ng-click="$ctrl.shortlist(application)"
        >
            Shortlist
        </button>
        <button
            class="btn btn-outline-danger btn-sm"
            ng-click="$ctrl.reject(application)"
        >
            Reject
        </button>
        <button
            class="btn btn-outline-primary btn-sm"
            ng-click="$ctrl.openSchedule(application)"
        >
            Schedule Interview
        </button>
    </div>
</div>

<schedule-interview
    application="$ctrl.activeApplication"
    on-close="$ctrl.closeSchedule()"
></schedule-interview>
