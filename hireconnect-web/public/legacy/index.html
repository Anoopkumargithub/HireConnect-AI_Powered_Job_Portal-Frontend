<!doctype html>
<html lang="en" ng-app="hireConnectApp">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>HireConnect</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles/app.css" />
    </head>
    <body ng-controller="MainController as main" class="hc-body">
        <header class="hc-topbar">
            <div
                class="container-fluid d-flex align-items-center justify-content-between"
            >
                <div class="d-flex align-items-center gap-3">
                    <div class="hc-brand">HireConnect</div>
                    <nav
                        class="hc-nav d-none d-md-flex"
                        ng-if="main.isLoggedIn()"
                    >
                        <a
                            ng-if="main.role === 'Candidate'"
                            href="#/candidate/jobs"
                            >Jobs</a
                        >
                        <a
                            ng-if="main.role === 'Candidate'"
                            href="#/candidate/applications"
                            >Applications</a
                        >
                        <a
                            ng-if="main.role === 'Candidate'"
                            href="#/candidate/profile"
                            >Profile</a
                        >
                        <a
                            ng-if="main.role === 'Candidate'"
                            href="#/candidate/ai-resume"
                            >AI Resume</a
                        >
                        <a
                            ng-if="main.role === 'Candidate'"
                            href="#/candidate/interviews"
                            >Interviews</a
                        >

                        <a
                            ng-if="main.role === 'Recruiter'"
                            href="#/recruiter/post-job"
                            >Post Job</a
                        >
                        <a
                            ng-if="main.role === 'Recruiter'"
                            href="#/recruiter/my-jobs"
                            >My Jobs</a
                        >
                        <a
                            ng-if="main.role === 'Recruiter'"
                            href="#/recruiter/applications"
                            >Applications</a
                        >

                        <a ng-if="main.role === 'Admin'" href="#/admin"
                            >Admin</a
                        >
                    </nav>
                </div>

                <div class="d-flex align-items-center gap-3">
                    <div ng-if="main.isLoggedIn()" class="hc-badge">
                        <i class="fa-solid fa-id-badge"></i>
                        <span>{{main.role}}</span>
                    </div>
                    <notification-dropdown
                        ng-if="main.isLoggedIn()"
                    ></notification-dropdown>
                    <button
                        class="btn btn-outline-light btn-sm"
                        ng-if="main.isLoggedIn()"
                        ng-click="main.logout()"
                    >
                        Logout
                    </button>
                    <a
                        class="btn btn-primary btn-sm"
                        ng-if="!main.isLoggedIn()"
                        href="#/login"
                        >Login</a
                    >
                </div>
            </div>
        </header>

        <main class="hc-main">
            <div class="hc-loading" ng-if="main.isLoading()">
                <div class="spinner-border text-primary" role="status"></div>
                <span>Loading...</span>
            </div>
            <div class="container-fluid hc-content">
                <div ng-view></div>
            </div>
        </main>

        <footer class="hc-footer">
            <div class="container-fluid">
                <span>HireConnect © 2026</span>
            </div>
        </footer>

        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-route.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>

        <script src="env.js"></script>
        <script src="app/app.module.js"></script>
        <script src="app/app.constants.js"></script>
        <script src="app/app.routes.js"></script>
        <script src="app/app.run.js"></script>
        <script src="app/main.controller.js"></script>

        <script src="app/shared/shared.module.js"></script>
        <script src="app/shared/enums.constants.js"></script>
        <script src="app/shared/enum.service.js"></script>
        <script src="app/shared/loading.service.js"></script>
        <script src="app/shared/api.service.js"></script>
        <script src="app/shared/auth.service.js"></script>
        <script src="app/shared/http.interceptor.js"></script>
        <script src="app/shared/file-model.directive.js"></script>
        <script src="app/shared/notification.service.js"></script>
        <script src="app/shared/notification.dropdown.component.js"></script>

        <script src="app/auth/auth.module.js"></script>
        <script src="app/auth/login.component.js"></script>
        <script src="app/auth/register.component.js"></script>

        <script src="app/candidate/candidate.module.js"></script>
        <script src="app/candidate/job-search.component.js"></script>
        <script src="app/candidate/applications.component.js"></script>
        <script src="app/candidate/profile.component.js"></script>
        <script src="app/candidate/ai-resume.component.js"></script>
        <script src="app/candidate/interviews.component.js"></script>

        <script src="app/recruiter/recruiter.module.js"></script>
        <script src="app/recruiter/post-job.component.js"></script>
        <script src="app/recruiter/my-jobs.component.js"></script>
        <script src="app/recruiter/applications-per-job.component.js"></script>
        <script src="app/recruiter/ranked-candidates.component.js"></script>
        <script src="app/recruiter/schedule-interview.component.js"></script>

        <script src="app/admin/admin.module.js"></script>
        <script src="app/admin/admin.component.js"></script>
    </body>
</html>
