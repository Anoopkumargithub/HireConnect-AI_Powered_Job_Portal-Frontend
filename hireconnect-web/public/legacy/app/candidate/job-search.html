<div class="hc-card">
    <div class="hc-section-title">Find your next opportunity</div>
    <form class="hc-grid two" ng-submit="$ctrl.search()">
        <div>
            <label class="form-label">Keyword</label>
            <input
                class="form-control hc-input"
                ng-model="$ctrl.filters.keyword"
                placeholder="Title, skills"
            />
        </div>
        <div>
            <label class="form-label">Location</label>
            <input
                class="form-control hc-input"
                ng-model="$ctrl.filters.location"
                placeholder="City or remote"
            />
        </div>
        <div>
            <label class="form-label">Category</label>
            <select
                class="form-select hc-input"
                ng-model="$ctrl.filters.category"
                ng-options="category.value as category.label for category in $ctrl.categories"
            >
                <option value="">Any</option>
            </select>
        </div>
        <div>
            <label class="form-label">Remote</label>
            <select
                class="form-select hc-input"
                ng-model="$ctrl.filters.isRemote"
            >
                <option value="">Any</option>
                <option value="true">Remote</option>
                <option value="false">Onsite</option>
            </select>
        </div>
        <div>
            <label class="form-label">Salary Min</label>
            <input
                class="form-control hc-input"
                type="number"
                ng-model="$ctrl.filters.salaryMin"
            />
        </div>
        <div>
            <label class="form-label">Salary Max</label>
            <input
                class="form-control hc-input"
                type="number"
                ng-model="$ctrl.filters.salaryMax"
            />
        </div>
        <div>
            <label class="form-label">Max Experience (years)</label>
            <input
                class="form-control hc-input"
                type="number"
                ng-model="$ctrl.filters.experienceMax"
            />
        </div>
        <div class="d-flex align-items-end">
            <button class="btn hc-btn-primary w-100" type="submit">
                Search Jobs
            </button>
        </div>
    </form>
    <div class="text-danger mt-2" ng-if="$ctrl.errorMessage">
        {{$ctrl.errorMessage}}
    </div>
</div>

<div class="hc-grid three mt-4">
    <div class="hc-card" ng-repeat="job in $ctrl.jobs">
        <div class="d-flex justify-content-between">
            <div>
                <div class="fw-semibold">{{job.title}}</div>
                <div class="text-muted">
                    {{job.location}} • {{$ctrl.typeLabel(job.type)}}
                </div>
            </div>
            <span class="hc-pill">{{$ctrl.categoryLabel(job.category)}}</span>
        </div>
        <p class="mt-3 text-muted">{{job.description}}</p>
        <div class="d-flex justify-content-between align-items-center">
            <div class="fw-semibold">{{$ctrl.formatSalary(job)}}</div>
            <button
                class="btn hc-btn-outline"
                ng-click="$ctrl.apply(job)"
                ng-disabled="job.applied"
            >
                {{job.applied ? 'Applied' : 'Apply'}}
            </button>
        </div>
    </div>
</div>
