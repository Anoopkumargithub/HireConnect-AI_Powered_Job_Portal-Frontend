<div class="hc-card">
    <div class="hc-section-title">AI Resume Analysis</div>
    <div class="d-flex gap-3 align-items-end">
        <div class="flex-grow-1">
            <label class="form-label">Resume File</label>
            <input
                class="form-control"
                type="file"
                file-model="$ctrl.resumeFile"
            />
        </div>
        <button
            class="btn hc-btn-primary"
            type="button"
            ng-click="$ctrl.analyze()"
        >
            Analyze
        </button>
    </div>
    <div class="text-danger mt-2" ng-if="$ctrl.errorMessage">
        {{$ctrl.errorMessage}}
    </div>
</div>

<div class="hc-card mt-4" ng-if="$ctrl.analysis">
    <div class="hc-section-title">Analysis Results</div>
    <div class="hc-grid two">
        <div>
            <div class="fw-semibold mb-2">Skills</div>
            <div class="d-flex flex-wrap gap-2">
                <span class="hc-pill" ng-repeat="skill in $ctrl.analysis.skills"
                    >{{skill}}</span
                >
            </div>
        </div>
        <div>
            <div class="fw-semibold mb-2">Suggested Roles</div>
            <ul class="list-unstyled">
                <li ng-repeat="role in $ctrl.analysis.suggestedJobTitles">
                    {{role}}
                </li>
            </ul>
        </div>
    </div>
    <div class="mt-3">
        <div class="fw-semibold mb-2">Summary</div>
        <p class="text-muted">{{$ctrl.analysis.summary}}</p>
    </div>
    <div class="mt-3 hc-grid two">
        <div>
            <div class="fw-semibold mb-2">Experience</div>
            <ul class="list-unstyled">
                <li ng-repeat="item in $ctrl.analysis.experience">{{item}}</li>
            </ul>
        </div>
        <div>
            <div class="fw-semibold mb-2">Education</div>
            <ul class="list-unstyled">
                <li ng-repeat="item in $ctrl.analysis.education">{{item}}</li>
            </ul>
        </div>
    </div>
</div>
